[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goldbot"
version = "0.1.0"
description = "Algorithmic Gold Trading System"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "click>=8.1.0",
    # Test + toolchain deps live in the main dependency list so that any
    # plain `uv sync` produces a fully-featured environment (dev/CI/CI-lite).
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    # Database mirroring (optional at runtime but import-safe)
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]

[project.scripts]
goldbot = "goldbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", "build", "dist", ".venv", "frontend/node_modules"]

[tool.ruff.lint]
select = ["I", "E", "F", "W", "N", "S"]
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic revisions contain long literal SQL fragments.
"migrations/versions/*" = ["E501", "W291"]
"migrations/env.py" = ["E402"]
# Local-only HTTP client in e2e scripts + deliberate soft-wait poll loops.
"scripts/*" = ["S310", "S110"]
# Demo/token fixture values only used against a mock server.
"tests/test_oanda_adapter.py" = ["S106"]
# OANDA adapter only ever talks to https://api-fxtrade.oanda.com or practice.
"src/goldbot/execution/oanda.py" = ["S310"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["frontend", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::pytest.PytestDeprecationWarning",
]
